
name: Deploy Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
        
      - run: npm install --legacy-peer-deps
      - name: Build frontend with backend API URL
        env:
          VITE_API_URL: https://efirbpzfimzmpchsovbz.supabase.co/functions/v1/api
          VITE_SUPABASE_ANON_KEY: sb_publishable_Z5Dj-_1weCpFUi1aNeyigg_uaEDIuVr
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        
